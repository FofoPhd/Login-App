
name: Login App CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  workflow-security:
    name: Scan Workflow Security
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Zizmor Scan
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b
        with:
          advanced-security: false

  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f Index.html
          test -f Script.js
          test -f Style.css
          test -f Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/fofophd/login-app:latest

      - name: Pull Docker Image
        run: docker pull ghcr.io/fofophd/login-app:latest

      - name: Run Docker Container
        run: |
          docker run -d --name login-app-test -p 8080:80 ghcr.io/fofophd/login-app:latest
          sleep 3
          curl --fail http://localhost:8080

      - name: Stop Docker Container
        if: always()
        run: docker stop login-app-test || true
