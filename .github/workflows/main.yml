name: Login App CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  workflow-security:
    name: Scan Workflow Security
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Zizmor Scan
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b
        with:
          advanced-security: false

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check project files
        run: |
          test -f Index.html
          test -f Script.js
          test -f Style.css
          test -f Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/fofophd/login-app:latest

      - name: Pull Docker Image
        run: docker pull ghcr.io/fofophd/login-app:latest

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/fofophd/login-app:latest
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'

      - name: Create Docker Network
        run: docker network create zapnet
  
      - name: Run Docker Container
        run: |
          docker run -d --name login-app-test --network zapnet -p 8080:80 ghcr.io/fofophd/login-app:latest
          sleep 3
          curl --fail http://localhost:8080

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm --network zapnet ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://login-app-test:80 -m 1 -I
            
      - name: Stop Docker Container
        if: always()
        run: docker stop login-app-test || true

  monitoring:
    name: Prometheus and Grafana Monitoring
    runs-on: ubuntu-latest
    needs: check

    permissions:
      packages: read
    
    steps:
      - name: Create Kubernetes Test Cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      - name: Verify Helm Installation
        run: helm version

      - name: Install Prometheus and Grafana
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --version 93.2.2 \
            --namespace monitoring \
            --create-namespace \
            --wait \
            --timeout 10m

          kubectl get pods -n monitoring

      - name: Deploy Login App on Kubernetes
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --docker-email="actions@github.com" \
            --dry-run=client -o yaml | kubectl apply -f -

          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: login-app
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: login-app
            template:
              metadata:
                labels:
                  app: login-app
              spec:
                imagePullSecrets:
                  - name: ghcr-secret
                containers:
                  - name: login-app
                    image: ghcr.io/fofophd/login-app:latest
                    ports:
                      - containerPort: 80
          EOF

          kubectl rollout status deployment/login-app --timeout=180s
